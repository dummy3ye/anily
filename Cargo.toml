[package]
name = "anily"
version = "0.1.2"
edition = "2021"
repository = "https://github.com/dummy3ye/anily"
homepage = "https://github.com/dummy3ye/anily"
description = "A fast terminal-based anime streaming and discovery CLI"
license = "MIT OR Apache-2.0"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"
directories = "5.0"
base64 = "0.22"
scraper = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
# toml crate for parsing config files
toml = "0.8"
libc = "0.2"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
